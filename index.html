    },
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTok,system:finalSys,messages})
  });
  if(!r.ok){
    const err=await r.json().catch(()=>({}));
    throw new Error(`API Error ${r.status}: ${err?.error?.message||r.statusText}`);
  }
  const d=await r.json();
  if(d.type==="error") throw new Error(`Claude: ${d.error?.message||"Unknown error"}`);
  if(!d.content?.length) throw new Error("Empty response from Claude API");
  // Track token savings: system compression + max_tokens reduction
  const actualOut = d.usage?.output_tokens || 0;
  const outSaved  = Math.max(0, BASE_MAX_TOK - actualOut);
  const totalSaved = savedSys + savedMaxTok + Math.round(outSaved * 0.5);
  TOK.add(totalSaved);
  return d.content.map(b=>b.text||"").join("")||"Unable to get response.";
}

// Compressed prompts save ~30-45% tokens vs verbose prompts
const SYS_DOCTOR_FULL = `You are an expert plant pathologist for Indian crops. For each diagnosis:\n🔍 WHAT I SEE (visual symptoms)\n🦠 DISEASE NAME (scientific name)\n⚙️ CAUSE (Fungal/Bacterial/Viral/Nutrient)\n⚠️ SEVERITY + % yield loss\n🌿 ORGANIC TREATMENT (neem oil, cow urine, Trichoderma — exact dosage)\n💊 CHEMICAL TREATMENT (Indian brand names, dosage per acre)\n🛡️ PREVENTION next season\n💰 COST per acre in ₹\n💡 PRO TIP`;
const SYS_DOCTOR_OPT  = `Expert plant pathologist, Indian crops. Diagnose concisely:\n🔍Visual symptoms 🦠Disease+scientific name ⚙️Cause ⚠️Severity+yield% 🌿Organic Rx(dosage) 💊Chemical Rx(Indian brands,dose/acre) 🛡️Prevention 💰₹cost/acre 💡Tip`;
const SYS_GEN_FULL    = `You are FarmSeva AI — expert agricultural advisor for Indian rural farmers. Practical low-cost advice. Indian context (₹, states, seasons, local names). Organic first. 250 words max. End with Pro Tip 💡.`;
const SYS_GEN_OPT     = `FarmSeva AI: expert Indian farm advisor. Low-cost practical advice. Use ₹, local names, organic first. ≤200 words. End: Pro Tip 💡.`;

const estimateTok = str => Math.ceil((str||"").length / 3.8);
const BASE_MAX_TOK   = 1000;  // old fixed value
const OPT_MAX_TOK    = { doctor:750, general:550 }; // smart limits

// Session token tracking
const TOK = {
  get saved(){ return parseInt(sessionStorage.getItem("fs_tok_saved")||0); },
  get calls(){ return parseInt(sessionStorage.getItem("fs_tok_calls")||0); },
  add(s){ sessionStorage.setItem("fs_tok_saved", this.saved+s); sessionStorage.setItem("fs_tok_calls", this.calls+1); window.dispatchEvent(new CustomEvent("tok",{detail:{saved:s}})); },
  reset(){ sessionStorage.removeItem("fs_tok_saved"); sessionStorage.removeItem("fs_tok_calls"); },
};

function getOptimizedSys(lc, role){
  const L = GL(lc);
  const langInstr = lc!=="en" ? ` Reply in ${L.name} only.` : "";
  if(role==="doctor"){
    const savedTok = estimateTok(SYS_DOCTOR_FULL) - estimateTok(SYS_DOCTOR_OPT + langInstr);
    return { sys: SYS_DOCTOR_OPT + langInstr, savedSys: Math.max(0, savedTok), maxTok: OPT_MAX_TOK.doctor };
  }
  const savedTok = estimateTok(SYS_GEN_FULL) - estimateTok(SYS_GEN_OPT + langInstr);
  return { sys: SYS_GEN_OPT + langInstr, savedSys: Math.max(0, savedTok), maxTok: OPT_MAX_TOK.general };
}

// Legacy wrapper (use getOptimizedSys directly for new calls)
function buildSys(lc,role){ return getOptimizedSys(lc,role).sys; }

  return html`
    <div onClick=${onClose} style=${{
      position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:300,
      display:"flex",flexDirection:"column",justifyContent:"flex-end"
    }}>
      <div onClick=${e=>e.stopPropagation()} style=${{
        background:"#14100a",borderRadius:"20px 20px 0 0",
        maxHeight:"75vh",display:"flex",flexDirection:"column",
        overflow:"hidden"
      }}>
        <!-- Handle bar -->
        <div style=${{display:"flex",justifyContent:"center",padding:"10px 0 0"}}>
          <div style=${{width:36,height:4,borderRadius:2,background:"#3d2b0f"}}/>

        <div style=${{padding:"10px 16px 8px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>

        </div>
        <!-- Search box -->
        <div style=${{padding:"0 14px 8px",flexShrink:0}}>
          <input type="text" value=${search} onInput=${e=>setSearch(e.target.value)}
            placeholder="Search state..."
            style=${{width:"100%",background:"#0f0a04",border:"1px solid #3d2b0f",borderRadius:10,
              color:"#f5e6c8",padding:"9px 13px",fontSize:14,outline:"none",
              fontFamily:"'Nunito Sans',sans-serif"}}/>
        </div>
        <!-- State list -->
        <div style=${{overflowY:"auto",padding:"0 14px 24px",flex:1}}>
          <!-- Clear selection option -->
          ${selected && html`
            <button onClick=${()=>{onSelect("");onClose();}}
              style=${{width:"100%",background:"#2d1f0a",border:"1px solid #3d2b0f",borderRadius:10,
                color:"#9e8a70",padding:"11px 14px",marginBottom:8,
                textAlign:"left",fontSize:13,cursor:"pointer",fontFamily:L.font}}>
              ✕ Clear selection
            </button>`}
          ${filtered.length===0 && html`
            <div style=${{color:"#5a4a35",fontSize:13,textAlign:"center",padding:"20px 0"}}>No states found</div>`}
          ${filtered.map(s=>html`
            <button key=${s} onClick=${()=>{onSelect(s);onClose();}}
              style=${{
                width:"100%",background:selected===s?"#2a1a2e":"#1a1208",
                border:`1px solid ${selected===s?"#ab47bc55":"#2d1f0a"}`,
                borderRadius:10,color:selected===s?"#ce93d8":"#f5e6c8",

                textAlign:"left",fontSize:14,cursor:"pointer",
                fontFamily:"'Nunito Sans',sans-serif",
                display:"flex",alignItems:"center",justifyContent:"space-between"
              }}>
              <span>${s}</span>
              ${selected===s && html`<span style=${{color:"#ab47bc",fontSize:16}}>✓</span>`}
            </button>`)}
        </div>
      </div>
    </div>`;
}

function SchemesScreen({lc,onBack,hasKey,openSetup}){

  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState("");

  const cr=useRef();
  const t=T[lc]||T.en;const L=GL(lc);const C="#ab47bc";

  const sendAI=useCallback(async(tx)=>{
    const text=tx!=null?tx:inp;
    if(!text.trim())return;
    const nm=[...msgs,{role:"user",content:text}];
    setMsgs(nm);setInp("");setLoad(true);
    try{
      const rep=await callClaude(nm,buildSys(lc,"general")+`\nContext: farmer from ${state||"India"} asking about government schemes.`);
      setMsgs([...nm,{role:"assistant",content:rep}]);
    }catch{setMsgs([...nm,{role:"assistant",content:"⚠️ Error. Please try again."}]);}

  const Card=({s,color})=>html`

          </div>

          <div style=${{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:15}}>${t.tools?.schemes?.n||"Gov Schemes"}</div>
          <div style=${{color:C,fontSize:10}}>Central + State Level Benefits</div>
        </div>
        ${hasKey

// ── GENERIC CHAT ───────────────────────────────────────────────────────
function GenericChat({tool,lc,onBack,hasKey,openSetup}){
  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState("");
  const [load,setLoad]=useState(false);
  const [img,setImg]=useState(null);
  const [imgB,setImgB]=useState(null);
  const cr=useRef();const fr=useRef();
  const t=T[lc]||T.en;const L=GL(lc);const td=t.tools?.[tool.id]||{};

  const onImg=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setImg(ev.target.result);setImgB(ev.target.result.split(",")[1]);};r.readAsDataURL(f);};

  const send=useCallback(async(tx)=>{
    const text=tx!=null?tx:inp;
    if(!text.trim()&&!imgB)return;
    const uc=(imgB&&msgs.length===0)?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imgB}},{type:"text",text:text||"Analyze this."}]:text;
    const nm=[...msgs,{role:"user",content:uc}];
    setMsgs(nm);setInp("");setLoad(true);
    try{
      const rep=await callClaude(nm,buildSys(lc,"general"));
      setMsgs([...nm,{role:"assistant",content:rep}]);
      if(msgs.length===0)setImgB(null);
    }catch(e){
      const msg=e.message==="API_KEY_MISSING"
        ?"🔑 API key not set. Go back to home and set your Claude API key."
        :"⚠️ "+e.message+". Check internet connection and try again.";
      setMsgs([...nm,{role:"assistant",content:msg}]);
    }
    setLoad(false);
    setTimeout(()=>cr.current?.scrollTo({top:9999,behavior:"smooth"}),100);
  },[inp,msgs,imgB,lc]);

  return html`
    <div style=${{display:"flex",flexDirection:"column",height:"100%",background:"#0f0a04",fontFamily:L.font}}>
      <div style=${{padding:"12px 14px",borderBottom:`1px solid ${tool.color}22`,background:"#14100a",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <button onClick=${onBack} style=${{background:"none",border:"none",color:tool.color,fontSize:22,cursor:"pointer",lineHeight:1}}>←</button>
        <span style=${{fontSize:20}}>${tool.icon}</span>
        <div style=${{flex:1}}>
          <div style=${{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:15}}>${td.n||tool.id}</div>
          <div style=${{color:tool.color,fontSize:10}}>${td.h||""}</div>
        </div>
      </div>
      <div ref=${cr} style=${{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:11}}>
        ${msgs.length===0&&html`
          <div style=${{textAlign:"center",padding:"16px 0"}}>
            <div style=${{fontSize:44,marginBottom:8}}>${tool.icon}</div>
            <div style=${{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontSize:16,marginBottom:5}}>${td.n||tool.id}</div>
            <div style=${{color:"#5a4a35",fontSize:12,marginBottom:16,lineHeight:1.5}}>${td.d||""}</div>
            <div style=${{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center"}}>
              ${(t.st?.[tool.id]||[]).map(s=>html`
                <button key=${s} onClick=${()=>setInp(s)}
                  style=${{background:"#1a1208",border:`1px solid ${tool.color}44`,color:"#f5e6c8",borderRadius:20,padding:"5px 12px",fontSize:11,cursor:"pointer",fontFamily:L.font}}>${s}</button>`)}
            </div>
          </div>`}
        ${img&&msgs.length===0&&html`<div style=${{display:"flex",justifyContent:"flex-end"}}><img src=${img} alt="" style=${{maxWidth:160,borderRadius:10,border:`2px solid ${tool.color}`}}/></div>`}
        ${msgs.map((m,i)=>html`<${Bubble} key=${i} m=${m} color=${tool.color} L=${L}/>`)}
        ${load&&html`
          <div style=${{display:"flex",gap:8}}>
            <div style=${{width:26,height:26,borderRadius:"50%",background:tool.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🌾</div>
            <div style=${{background:"rgba(255,255,255,.06)",border:`1px solid ${tool.color}22`,borderRadius:"4px 18px 18px 18px",padding:"11px 14px"}}><${Dots} color=${tool.color}/></div>
          </div>`}
      </div>
      <div style=${{padding:"10px 12px",borderTop:`1px solid ${tool.color}22`,background:"#14100a",flexShrink:0}}>
        ${!hasKey ? html`
          <div style=${{background:"#1a1208",border:`1px solid ${tool.color}33`,borderRadius:12,padding:"12px 14px",textAlign:"center"}}>
            <div style=${{color:tool.color,fontWeight:700,fontSize:13,marginBottom:3}}>🔑 API Key Required</div>
            <div style=${{color:"#7a6a55",fontSize:11,marginBottom:9,lineHeight:1.5}}>Enter your Claude API key to use this AI tool</div>
            <button onClick=${()=>openSetup()}
              style=${{background:`linear-gradient(135deg,#b45309,#f5a623)`,border:"none",color:"#0a0a0a",borderRadius:10,padding:"8px 18px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              Enter API Key →
            </button>
          </div>
        ` : html`
          ${img&&html`
            <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <img src=${img} alt="" style=${{width:34,height:34,objectFit:"cover",borderRadius:6}}/>
              <span style=${{color:"#7a6a55",fontSize:11,flex:1}}>📷 Ready</span>
              <button onClick=${()=>{setImg(null);setImgB(null);}} style=${{background:"none",border:"none",color:"#ff5252",fontSize:16,cursor:"pointer"}}>×</button>
            </div>`}
          <div style=${{display:"flex",gap:7}}>
            ${tool.id==="pest-alert"&&html`
              <input type="file" ref=${fr} accept="image/*" onChange=${onImg} style=${{display:"none"}}/>
              <button onClick=${()=>fr.current.click()} style=${{background:"#1a1208",border:`1px solid ${tool.color}44`,color:tool.color,borderRadius:10,padding:"0 11px",fontSize:17,cursor:"pointer"}}>📷</button>`}
            <textarea value=${inp} onInput=${e=>setInp(e.target.value)} rows="2"
              onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(inp);}}}
              placeholder=${t.ph?.[tool.id]||"Ask anything..."}
              style=${{flex:1,background:"#1a1208",border:`1px solid ${tool.color}22`,borderRadius:10,color:"#f5e6c8",padding:"8px 11px",fontSize:13,resize:"none",fontFamily:L.font,outline:"none"}}/>
            <button onClick=${()=>send(inp)} disabled=${load}
              style=${{background:tool.color,border:"none",borderRadius:10,color:"#0a0a0a",padding:"0 13px",fontSize:19,cursor:"pointer",opacity:load?.6:1}}>→</button>
          </div>`}
      </div>
    </div>`;
}

<script>
// ── PWA ICON ───────────────────────────────────────────────────────
function genIcon(sz){
  const c=document.createElement("canvas");c.width=sz;c.height=sz;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,sz,sz);
  g.addColorStop(0,"#1e3a1a");g.addColorStop(1,"#2d4a0a");
  x.fillStyle=g;
  const r=sz*.18;
  x.beginPath();x.moveTo(r,0);x.lineTo(sz-r,0);x.quadraticCurveTo(sz,0,sz,r);
  x.lineTo(sz,sz-r);x.quadraticCurveTo(sz,sz,sz-r,sz);x.lineTo(r,sz);
  x.quadraticCurveTo(0,sz,0,sz-r);x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);
  x.closePath();x.fill();
  x.strokeStyle="#f5a623";x.lineWidth=sz*.03;x.stroke();
  x.beginPath();x.arc(sz/2,sz/2,sz*.38,0,Math.PI*2);x.fillStyle="rgba(0,0,0,.2)";x.fill();
  x.font=`${sz*.44}px serif`;x.textAlign="center";x.textBaseline="middle";
  x.fillText("🌾",sz/2,sz/2+sz*.02);
  x.fillStyle="#f5a623";x.font=`bold ${sz*.095}px 'Nunito Sans',sans-serif`;
  x.fillText("FarmSeva",sz/2,sz*.88);
  return c.toDataURL("image/png");
}

const canSW=!inIframe&&"serviceWorker" in navigator
  &&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1");

if(canSW){
  try{
    const SW=`const CV="farmseva-v1";
const PRE=["./",
  "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
  "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",
  "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"];
self.addEventListener("install",e=>{e.waitUntil(caches.open(CV).then(c=>c.addAll(PRE)).then(()=>self.skipWaiting()));});
self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CV).map(x=>caches.delete(x)))).then(()=>self.clients.claim()));});
self.addEventListener("fetch",e=>{
  if(e.request.url.includes("anthropic.com")||e.request.method!=="GET")return;
  e.respondWith(caches.match(e.request).then(hit=>{
    if(hit)return hit;
    return fetch(e.request).then(r=>{if(r.ok&&r.type!=="opaque"){const cl=r.clone();caches.open(CV).then(c=>c.put(e.request,cl));}return r;})
      .catch(()=>hit||new Response('<html><body style="background:#0f0a04;color:#f5a623;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;text-align:center"><div style="font-size:52px">🌾</div><div style="font-size:20px;font-weight:700">FarmSeva AI</div><div style="color:#7a6a55;font-size:13px;max-width:280px">Offline — AI features need internet. UI + scheme info works offline.</div></body></html>',{headers:{"Content-Type":"text/html"}}));
  }));
});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([SW],{type:"application/javascript"})))
      .then(()=>console.info("✅ FarmSeva SW v1 registered"))
      .catch(e=>console.info("SW skip:",e.message));
  }catch(e){}
}

// ── API ────────────────────────────────────────────────────────────────
async function callClaude(messages,system){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,messages})
  });
  const d=await r.json();
  return d.content?.map(b=>b.text||"").join("")||"Unable to get response.";
}
function buildSys(lc,role){
  const L=GL(lc);
  const li=lc!=="en"?`\n\nCRITICAL: Respond ONLY in ${L.name} (${L.native}). Scientific/technical terms may stay in English.`:"";
  if(role==="doctor")return`You are an expert plant pathologist for Indian crops. For each diagnosis:\n🔍 WHAT I SEE (visual symptoms in the photo)\n🦠 DISEASE NAME (scientific name)\n⚙️ CAUSE (Fungal/Bacterial/Viral/Nutrient)\n⚠️ SEVERITY + % yield loss\n🌿 ORGANIC TREATMENT (neem oil, cow urine, Trichoderma — exact dosage)\n💊 CHEMICAL TREATMENT (Indian brand names, dosage per acre)\n🛡️ PREVENTION next season\n💰 COST per acre in ₹\n💡 PRO TIP${li}`;
  return`You are KisanMitra AI — expert agricultural advisor for Indian rural farmers. Practical low-cost advice. Indian context (₹, states, seasons, local names). Organic first. 250 words max. End with Pro Tip 💡.${li}`;
}

// ── CROP DOCTOR ────────────────────────────────────────────────────────
function CropDoctor({lc,onBack}){
  const [sub,setSub]=useState("chat");
  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState("");
  const [img,setImg]=useState(null);
  const [imgB,setImgB]=useState(null);
  const [load,setLoad]=useState(false);
  const [exCat,setExCat]=useState(null);
  const [demoPhase,setDemoPhase]=useState("idle");
  const [demoPct,setDemoPct]=useState(0);
  const [demoRes,setDemoRes]=useState("");
  const fr=useRef();const cr=useRef();
  const t=T[lc]||T.en;const L=GL(lc);const td=t.tools?.["crop-doctor"]||{};

  const onImg=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{setImg(ev.target.result);setImgB(ev.target.result.split(",")[1]);};
    r.readAsDataURL(f);
  };
  const send=useCallback(async(tx=inp)=>{
    if(!tx.trim()&&!imgB)return;
    const uc=(imgB&&msgs.length===0)?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imgB}},{type:"text",text:tx||"Analyze this crop image."}]:tx;
    const nm=[...msgs,{role:"user",content:uc}];
    setMsgs(nm);setInp("");setLoad(true);
    try{const rep=await callClaude(nm,buildSys(lc,"doctor"));setMsgs([...nm,{role:"assistant",content:rep}]);if(msgs.length===0)setImgB(null);}
    catch{setMsgs([...nm,{role:"assistant",content:"⚠️ Connection error. Please try again."}]);}
    setLoad(false);setTimeout(()=>cr.current?.scrollTo({top:9999,behavior:"smooth"}),100);
  },[inp,msgs,imgB,lc]);

  const runDemo=async()=>{
    setDemoPhase("loading");setDemoPct(0);
    for(const p of[20,45,65,82,95]){await new Promise(r=>setTimeout(r,600+Math.random()*300));setDemoPct(p);}
    try{
      const resp=await fetch(RICE_URL);const blob=await resp.blob();
      const b64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(",")[1]);r.readAsDataURL(blob);});
      const result=await callClaude([{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:"Diagnose this paddy rice crop. I am a farmer in India. Give complete actionable diagnosis."}]}],buildSys(lc,"doctor"));
      setDemoPct(100);setDemoRes(result);setDemoPhase("done");
    }catch(e){setDemoRes("⚠️ Error: "+e.message);setDemoPhase("done");}
  };

  const C="#4caf50";

    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#080f08",fontFamily:L.font}}>
      {/* Header */}
      <div style={{padding:"12px 14px",borderBottom:`1px solid ${C}22`,background:"#0a120a",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:C,fontSize:22,cursor:"pointer",lineHeight:1}}>←</button>
        <span style={{fontSize:20}}>🌿</span>
        <div style={{flex:1}}>
          <div style={{color:"#e8f5e9",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:15}}>{td.n||"Crop Doctor"}</div>
          <div style={{color:C,fontSize:10}}>{td.h}</div>
        </div>
        <div style={{display:"flex",background:"#0d1f0d",borderRadius:20,overflow:"hidden"}}>
          {[["chat",t.t1||"Diagnose"],["crops",t.t2||"80+ Crops"],["demo","🌾 Demo"]].map(([id,lb])=>(
            <button key={id} onClick={()=>setSub(id)} style={{padding:"5px 9px",fontSize:10,border:"none",cursor:"pointer",fontWeight:700,background:sub===id?C:"transparent",color:sub===id?"#0a0a0a":C,whiteSpace:"nowrap"}}>{lb}</button>
          ))}
        </div>
      </div>

      {/* DEMO */}
      {sub==="demo"&&(
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          <div style={{borderRadius:14,overflow:"hidden",border:`2px solid ${C}33`,marginBottom:12,position:"relative"}}>
            <img src={RICE_URL} alt="Paddy rice Brown Spot" style={{width:"100%",display:"block",maxHeight:220,objectFit:"cover",filter:"brightness(.9)"}}/>
            <div style={{position:"absolute",top:10,left:10,background:"#ef535088",border:"1px solid #ef5350",color:"#fff",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700}}>🔴 Brown Spot Disease</div>
            <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,.8)",padding:"18px 12px 10px"}}>
              <div style={{color:"#fff",fontSize:12,fontWeight:700}}>📍 {t.demoT}</div>
              <div style={{color:"#a5d6a7",fontSize:10,marginTop:2}}>Bipolaris oryzae · Brown oval lesions with yellow halos</div>
            </div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            {[["🟤","Brown oval spots"],["💛","Yellow halo rings"],["🍃","Leaf wilting"],["⚠️","Moderate severity"]].map(([ic,lb])=>(
              <div key={lb} style={{background:"#0d1a0d",border:`1px solid ${C}33`,borderRadius:20,padding:"4px 10px",fontSize:11,color:"#a5d6a7",display:"flex",gap:5,alignItems:"center"}}><span>{ic}</span><span>{lb}</span></div>

function SchemesScreen({lc,onBack}){
  const [tab,setTab]=useState("central");

    try{const rep=await callClaude(nm,buildSys(lc,"general")+`\nContext: farmer from ${state||"India"} asking about government schemes.`);setMsgs([...nm,{role:"assistant",content:rep}]);}
    catch{setMsgs([...nm,{role:"assistant",content:"⚠️ Error. Please try again."}]);}

  const Card=({s,color})=>(
    <div style={{border:`1px solid ${color}33`,borderRadius:11,overflow:"hidden",marginBottom:9}}>

            {s.website&&<a href={`https://${s.website}`} target="_blank" rel="noreferrer" style={{background:"#1a1208",color:"#f5e6c8",padding:"5px 11px",borderRadius:20,fontSize:11,textDecoration:"none",border:`1px solid ${color}33`}}>🌐 Website</a>}
          </div>
          <button onClick={()=>{setAiOpen(true);setInp(`Am I eligible for ${s.name}? I am from ${state||"India"}.`);}}

        <span>📋</span>
        <div style={{flex:1}}>
          <div style={{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:15}}>{(T[lc]||T.en).tools?.schemes?.n||"Gov Schemes"}</div>
          <div style={{color:C,fontSize:10}}>Central + State Level Benefits</div>
        </div>
        <button onClick={()=>setAiOpen(!aiOpen)} style={{background:`${C}22`,border:`1px solid ${C}44`,color:C,borderRadius:20,padding:"5px 11px",fontSize:11,cursor:"pointer",fontWeight:700}}>{t.askAI}</button>
      </div>

      {aiOpen?(
        <>
          <div ref={cr} style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10}}>
            {msgs.length===0&&(
              <div style={{textAlign:"center",padding:"18px 0",color:"#7a6a55"}}>
                <div style={{fontSize:36,marginBottom:8}}>🤖</div>

            <button onClick={()=>sendAI()} disabled={load} style={{background:C,border:"none",borderRadius:10,color:"#fff",padding:"0 13px",fontSize:18,cursor:"pointer"}}>→</button>

            {["central","state"].map(tb=>(
              <button key={tb} onClick={()=>setTab(tb)} style={{flex:1,padding:"7px 0",border:"none",cursor:"pointer",fontSize:11,fontWeight:700,background:tab===tb?C:"transparent",color:tab===tb?"#0a0a0a":C}}>

            ))}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"11px 13px 20px"}}>
            {tab==="central"&&CENTRAL.map(s=><Card key={s.id} s={s} color={s.color}/>)}

              <div style={{textAlign:"center",padding:"36px 0",color:"#7a6a55"}}>

              </div>
            )}
            {tab==="state"&&state&&(STATES[state]||[]).map(s=><Card key={s.name} s={s} color={C}/>)}
            {tab==="state"&&state&&!(STATES[state]?.length)&&(
              <div style={{textAlign:"center",padding:"28px 0"}}>
                <button onClick={()=>setAiOpen(true)} style={{background:`${C}22`,border:`1px solid ${C}44`,color:C,borderRadius:20,padding:"9px 18px",fontSize:12,cursor:"pointer"}}>{t.askAI} for {state} schemes</button>
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

// ── GENERIC CHAT ───────────────────────────────────────────────────────
function GenericChat({tool,lc,onBack}){
  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState("");
  const [load,setLoad]=useState(false);
  const [imgB,setImgB]=useState(null);
  const [img,setImg]=useState(null);
  const cr=useRef();const fr=useRef();
  const t=T[lc]||T.en;const L=GL(lc);const td=t.tools?.[tool.id]||{};

  const onImg=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setImg(ev.target.result);setImgB(ev.target.result.split(",")[1]);};r.readAsDataURL(f);};

  const send=useCallback(async(tx=inp)=>{
    if(!tx.trim()&&!imgB)return;
    const uc=(imgB&&msgs.length===0)?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imgB}},{type:"text",text:tx||"Analyze this."}]:tx;
    const nm=[...msgs,{role:"user",content:uc}];
    setMsgs(nm);setInp("");setLoad(true);
    try{const rep=await callClaude(nm,buildSys(lc,"general"));setMsgs([...nm,{role:"assistant",content:rep}]);if(msgs.length===0)setImgB(null);}
    catch{setMsgs([...nm,{role:"assistant",content:"⚠️ Connection error. Please try again."}]);}
    setLoad(false);setTimeout(()=>cr.current?.scrollTo({top:9999,behavior:"smooth"}),100);
  },[inp,msgs,imgB,lc]);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#0f0a04",fontFamily:L.font}}>
      <div style={{padding:"12px 14px",borderBottom:`1px solid ${tool.color}22`,background:"#14100a",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:tool.color,fontSize:22,cursor:"pointer",lineHeight:1}}>←</button>
        <span style={{fontSize:20}}>{tool.icon}</span>
        <div style={{flex:1}}>
          <div style={{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:15}}>{td.n||tool.id}</div>
          <div style={{color:tool.color,fontSize:10}}>{td.h||""}</div>
        </div>
      </div>
      <div ref={cr} style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:11}}>
        {msgs.length===0&&(
          <div style={{textAlign:"center",padding:"16px 0"}}>
            <div style={{fontSize:44,marginBottom:8}}>{tool.icon}</div>
            <div style={{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontSize:16,marginBottom:5}}>{td.n||tool.id}</div>
            <div style={{color:"#5a4a35",fontSize:12,marginBottom:16,lineHeight:1.5}}>{td.d||""}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center"}}>
              {(t.st?.[tool.id]||[]).map(s=>(
                <button key={s} onClick={()=>setInp(s)} style={{background:"#1a1208",border:`1px solid ${tool.color}44`,color:"#f5e6c8",borderRadius:20,padding:"5px 12px",fontSize:11,cursor:"pointer",fontFamily:L.font}}>{s}</button>
              ))}
            </div>
          </div>
        )}
        {img&&msgs.length===0&&<div style={{display:"flex",justifyContent:"flex-end"}}><img src={img} alt="" style={{maxWidth:160,borderRadius:10,border:`2px solid ${tool.color}`}}/></div>}
        {msgs.map((m,i)=><Bubble key={i} m={m} color={tool.color} L={L}/>)}
        {load&&<div style={{display:"flex",gap:8}}><div style={{width:26,height:26,borderRadius:"50%",background:tool.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🌾</div><div style={{background:"rgba(255,255,255,.06)",border:`1px solid ${tool.color}22`,borderRadius:"4px 18px 18px 18px",padding:"11px 14px"}}><Dots color={tool.color}/></div></div>}
      </div>
      <div style={{padding:"10px 12px",borderTop:`1px solid ${tool.color}22`,background:"#14100a",flexShrink:0}}>
        {img&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><img src={img} alt="" style={{width:34,height:34,objectFit:"cover",borderRadius:6}}/><span style={{color:"#7a6a55",fontSize:11,flex:1}}>📷 Ready</span><button onClick={()=>{setImg(null);setImgB(null);}} style={{background:"none",border:"none",color:"#ff5252",fontSize:16,cursor:"pointer"}}>×</button></div>}
        <div style={{display:"flex",gap:7}}>
          {tool.id==="pest-alert"&&<><input type="file" ref={fr} accept="image/*" onChange={onImg} style={{display:"none"}}/><button onClick={()=>fr.current.click()} style={{background:"#1a1208",border:`1px solid ${tool.color}44`,color:tool.color,borderRadius:10,padding:"0 11px",fontSize:17,cursor:"pointer"}}>📷</button></>}
          <textarea value={inp} onChange={e=>setInp(e.target.value)} rows={2} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder={t.ph?.[tool.id]||"Ask anything..."}
            style={{flex:1,background:"#1a1208",border:`1px solid ${tool.color}22`,borderRadius:10,color:"#f5e6c8",padding:"8px 11px",fontSize:13,resize:"none",fontFamily:L.font,outline:"none"}}/>
          <button onClick={()=>send()} disabled={load} style={{background:tool.color,border:"none",borderRadius:10,color:"#0a0a0a",padding:"0 13px",fontSize:19,cursor:"pointer",opacity:load?.6:1}}>→</button>
        </div>
      </div>
    </div>
  );
}

              <button key={tl.id} onClick={()=>{setActiveTool(tl);setScreen("tool");}}

                onMouseEnter={e=>{e.currentTarget.style.background="#1e1408";e.currentTarget.style.borderColor=tl.color+"66";}}
                onMouseLeave={e=>{e.currentTarget.style.background="#14100a";e.currentTarget.style.borderColor=tl.color+"28";}}>
                <div style={{position:"absolute",top:0,right:0,width:48,height:48,background:`radial-gradient(circle at 100% 0%,${tl.color}18,transparent)`,pointerEvents:"none"}}/>
                <div style={{fontSize:24,marginBottom:7}}>{tl.icon}</div>
                <div style={{color:"#f5e6c8",fontFamily:"'Bitter',serif",fontWeight:700,fontSize:13,marginBottom:2}}>{td.n||tl.id}</div>
                <div style={{color:tl.color,fontSize:10,marginBottom:5,fontFamily:L.font}}>{td.h||""}</div>
                <div style={{color:"#5a4a35",fontSize:10,lineHeight:1.4,fontFamily:L.font}}>{td.d||""}</div>
                {td.b&&<div style={{marginTop:7,background:tl.id==="crop-doctor"?"#1e3a1a":"#2a1a2e",color:tl.color,fontSize:9,padding:"2px 8px",borderRadius:10,display:"inline-block",fontWeight:700,fontFamily:"'Nunito Sans',sans-serif"}}>{td.b}</div>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Tip */}
      <div style={{margin:"0 13px 22px",background:"#14100a",border:"1px solid #f5a62318",borderRadius:11,padding:"12px 13px"}}>
        <div style={{color:"#f5a623",fontSize:11,fontWeight:700,marginBottom:4,fontFamily:"'Nunito Sans',sans-serif"}}>{t.tip}</div>
        <div style={{color:"#7a6a55",fontSize:12,lineHeight:1.65,fontFamily:L.font}}>{t.tipT}</div>
      </div>
      <style>{`@keyframes kb{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
setTimeout(()=>{const s=document.getElementById("spl");s.style.opacity="0";setTimeout(()=>s.style.display="none",400);},600);
</script>

<script>
// ── PWA ICON ────────────────────────────────────────────────────────
function genIcon(sz){
  const c=document.createElement("canvas");c.width=sz;c.height=sz;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,sz,sz);
  g.addColorStop(0,"#1e3a1a");g.addColorStop(1,"#2d4a0a");
  x.fillStyle=g;
  const r=sz*.18;
  x.beginPath();x.moveTo(r,0);x.lineTo(sz-r,0);x.quadraticCurveTo(sz,0,sz,r);
  x.lineTo(sz,sz-r);x.quadraticCurveTo(sz,sz,sz-r,sz);x.lineTo(r,sz);
  x.quadraticCurveTo(0,sz,0,sz-r);x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.closePath();x.fill();
  x.strokeStyle="#f5a623";x.lineWidth=sz*.03;x.stroke();
  x.beginPath();x.arc(sz/2,sz/2,sz*.38,0,Math.PI*2);x.fillStyle="rgba(0,0,0,.2)";x.fill();
  x.font=`${sz*.44}px serif`;x.textAlign="center";x.textBaseline="middle";
  x.fillText("🌾",sz/2,sz/2+sz*.02);
  x.fillStyle="#f5a623";x.font=`bold ${sz*.095}px 'Nunito Sans',sans-serif`;
  x.fillText("KisanMitra",sz/2,sz*.88);
  return c.toDataURL("image/png");
}
// ── Detect if running inside an iframe (Claude preview / sandboxed) ──
const inIframe = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();

// ── PWA ICON — safe in all contexts ─────────────────────────────────
const ic192=genIcon(192), ic512=genIcon(512);
try{ document.getElementById("ai").href=ic192; }catch(e){}

if(!inIframe){

    };

  }catch(e){ console.info("Manifest skipped:",e.message); }
}

// ── SERVICE WORKER — only register when top-level HTTPS/localhost ────
const canSW = !inIframe
  && "serviceWorker" in navigator
  && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1");

if(canSW){
  try{
    const SW=`
const CV="kisanmitra-v3";
const PRE=["./",
  "https://unpkg.com/react@18/umd/react.production.min.js",
  "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
  "https://unpkg.com/@babel/standalone/babel.min.js"];
self.addEventListener("install",e=>{
  e.waitUntil(caches.open(CV).then(c=>c.addAll(PRE)).then(()=>self.skipWaiting()));
});
self.addEventListener("activate",e=>{
  e.waitUntil(caches.keys()
    .then(keys=>Promise.all(keys.filter(k=>k!==CV).map(k=>caches.delete(k))))
    .then(()=>self.clients.claim()));
});
self.addEventListener("fetch",e=>{
  if(e.request.url.includes("anthropic.com")||e.request.method!=="GET")return;
  e.respondWith(caches.match(e.request).then(hit=>{
    if(hit)return hit;
    return fetch(e.request).then(r=>{
      if(r.ok&&r.type!=="opaque"){const cl=r.clone();caches.open(CV).then(c=>c.put(e.request,cl));}
      return r;
    }).catch(()=>hit||new Response(
      \`<html><body style="background:#0f0a04;color:#f5a623;font-family:sans-serif;
        display:flex;align-items:center;justify-content:center;height:100vh;
        flex-direction:column;gap:12px;text-align:center">

          You are offline. Connect to internet for AI features.<br>All scheme info works offline.
        </div></body></html>\`,
      {headers:{"Content-Type":"text/html"}}
    ));
  }));
});`;
    const swBlob=new Blob([SW],{type:"application/javascript"});

      .catch(e=>console.info("SW skipped:",e.message));
  }catch(e){ console.info("SW skipped:",e.message); }
}
